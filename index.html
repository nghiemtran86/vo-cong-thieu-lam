:root[data-theme="dark"]{--bg:#17110f;--card:#241b18;--ink:#f1e7e0;--mute:#b3a49c;--brand:#e58a7e;--poem:#f0a24e;--line:#3a2d28;--chip:#33261f;--ebg:#12302a;--eink:#5fd3b3;--on:#241b18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 14px 6px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:20px;color:var(--brand)}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 14px 10px;border-bottom:1px solid var(--line)}

input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
main{max-width:1200px;margin:0 auto;padding:12px 14px 28px}
#count{color:var(--mute);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.top{display:flex;gap:10px;align-items:flex-start}
.top img,.ph{width:48px;height:48px;flex:none;border-radius:8px;background:var(--chip)}
.top h2{margin:0;font-size:16px;color:var(--brand);line-height:1.3}.poem{margin:2px 0 0;font-size:12px;font-style:italic;color:var(--poem)}
.tag{margin-left:auto;flex:none;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.stat{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:12px}.stat b{color:var(--mute);font-weight:600}
.desc{margin:0;font-size:14px}
.ext{margin-top:10px;background:var(--ebg);color:var(--eink);border-radius:10px;padding:8px 10px;font-size:13px}
.ext ul{margin:0;padding-left:18px}
.empty{text-align:center;color:var(--mute);padding:40px 0}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase();
const all=DATA.flatMap(s=>s.skills.map(k=>({...k,set:s.name,sub:s.sub,key:norm([k.name,k.poem,k.mota,k.extra.join(" ")].join(" "))})));
const ncs=[...new Set(all.map(k=>k.nc))];
let st={q:"",set:"",nc:""};
function chips(id,opts,key,label){
  const el=document.getElementById(id);
  el.innerHTML=[["",label]].concat(opts.map(o=>[o,o])).map(([v,t])=>`<button class="chip${st[key]===v?" on":""}" data-v="${esc(v)}">${esc(t)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;st[key]=b.dataset.v;draw()};
}
function card(k){
  const stats=[["Cự ly",k.culy],["Hao",k.hao],["Vũ khí",k.vukhi]].concat(k.thi.map(t=>[null,t])).concat([["Nội công",k.nc]]);
  return `<article class="card"><div class="top">${k.icon?`<img src="${k.icon}" alt="">`:'<div class="ph"></div>'}
  <div><h2>${esc(k.name)}</h2><p class="poem">${esc(k.poem)}</p></div><span class="tag">${esc(k.tang)}</span></div>
  <div class="stats">${stats.map(([a,b])=>`<span class="stat">${a?`<b>${a}:</b> `:""}${esc(b)}</span>`).join("")}</div>
  <p class="desc">${esc(k.mota)}</p>
  ${k.extra.length?`<div class="ext"><ul>${k.extra.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`:""}</article>`;
}
function draw(){
  chips("fs",DATA.map(s=>s.name),"set","Tất cả bộ");
  chips("fn",ncs,"nc","Mọi nội công");
  const q=norm(st.q.trim());
  const r=all.filter(k=>(!st.set||k.set===st.set)&&(!st.nc||k.nc===st.nc)&&(!q||k.key.includes(q)));
  document.getElementById("count").textContent=r.length+" chiêu thức";
  document.getElementById("grid").innerHTML=r.length?r.map(card).join(""):"";
  if(!r.length)document.getElementById("grid").innerHTML='<p class="empty">Không tìm thấy chiêu thức phù hợp.</p>';
}
document.getElementById("q").addEventListener("input",e=>{st.q=e.target.value;draw()});
draw();
</script></body></html>
